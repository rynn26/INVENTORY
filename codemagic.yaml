workflows:
  ios-release:
    name: iOS Release Build (Sideloadly Ready)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build Flutter iOS Release (No Codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Package IPA for Sideloadly
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="$CM_BUILD_DIR/build/output"
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -qr Runner.ipa Payload
          rm -rf Payload

    artifacts:
      - build/output/Runner.ipa
