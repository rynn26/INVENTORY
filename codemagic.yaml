workflows:
  ios-release:
    name: iOS Release Build (Sideloadly Ready)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Build Flutter iOS Release IPA
        script: |
          flutter build ipa --release --no-codesign
          cd build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr Runner.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/output
          mv Runner.ipa $CM_BUILD_DIR/build/output/
    artifacts:
      - build/output/Runner.ipa
